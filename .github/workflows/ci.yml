# Continuous integration: compile, unit tests, TestFX UI tests, and package.
# JavaFX/TestFX on Linux requires a virtual framebuffer and GTK/font libraries.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install JavaFX / TestFX system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libgtk-3-0 \
            libgdk-pixbuf2.0-0 \
            libfontconfig1 \
            fonts-dejavu

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Verify (compile, test, package)
        env:
          CI: true
        run: >-
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24'
          ./mvnw -B verify

      - name: Upload Surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.run_id }}
          path: target/surefire-reports/
          retention-days: 14

      - name: Upload packaged JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: portal-jars-${{ github.run_id }}
          path: |
            target/tarecruit-ta-*.jar
            target/tarecruit-mo-*.jar
          retention-days: 7
